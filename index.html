const SIZES=['295/80 R22.5', '275/80 R22.5', '315/80 R22.5', '295/75 R22.5', '275/70 R22.5', '295/60 R22.5', '255/70 R22.5', '385/65 R22.5', '445/65 R22.5', '435/50 R19.5', '305/70 R19.5', '285/70 R19.5', '265/70 R19.5', '245/70 R19.5', '225/70 R19.5', '235/75 R17.5', '215/75 R17.5', '225/75 R17.5', '11 R22.5', '12 R22.5', '11 R24.5', '12 R24.5', '9.5 R17.5', '7.50 R16', '8.25 R16', '9.00 R20', '10.00 R20', '11.00 R20', '12.00 R20', '175/70 R13', '175/65 R14', '185/70 R14', '185/60 R15', '185/65 R15', '195/50 R15', '195/55 R16', '195/60 R15', '195/65 R15', '205/55 R16', '205/60 R16', '205/65 R15', '215/55 R17', '215/65 R16', '225/45 R17', '225/65 R17', '235/60 R18', '235/75 R15', '245/70 R16', '265/65 R17', '265/70 R16', '175/75 R16C', '195/75 R16C', '205/75 R16C', '215/75 R16C', '225/75 R16C', '235/65 R16C', '80/100-18', '90/90-18', '90/90-19', '100/80-17', '110/80-19', '110/90-17', '120/70-17', '130/70-17', '140/70-17', '150/70-17', '14.9-24', '18.4-34', '23.1-26', '17.5 R25', '20.5 R25', '23.5 R25', '26.5 R25'];

const defAxles=()=>[{id:'a1',name:'Eixo 1',type:'dir',dual:false},{id:'a2',name:'Eixo 2',type:'tr',dual:true},{id:'a3',name:'Estepe',type:'est',dual:false}];
const LEG={'Dianteiro Esquerdo':'Eixo 1 · Esquerdo','Dianteiro Direito':'Eixo 1 · Direito','Tração Esquerdo Externo':'Eixo 2 · Esquerdo Externo','Tração Esquerdo Interno':'Eixo 2 · Esquerdo Interno','Tração Direito Interno':'Eixo 2 · Direito Interno','Tração Direito Externo':'Eixo 2 · Direito Externo','Estepe':'Estepe'};
const migrate=s=>{(s.vehicles||[]).forEach(v=>{if(!v.kind)v.kind='veiculo'});s.tires.forEach(t=>{if(t.brand)t.brand=String(t.brand).toUpperCase()});if(!s.services)s.services=[];if(!s.fuel)s.fuel=[];if(!s.fuelPrices)s.fuelPrices={};s.tires.sort(byId);s.vehicles.sort(byPlate);if(s.vehicles.every(v=>v.axles))return s;s.vehicles.forEach(v=>{if(!v.axles)v.axles=defAxles()});const m=x=>x&&x.split(' ⇄ ').map(p=>p.split(' → ').map(q=>LEG[q]||q).join(' → ')).join(' ⇄ ');s.tires.forEach(t=>{if(t.pos)t.pos=LEG[t.pos]||t.pos});s.history.forEach(h=>{h.pos=m(h.pos)});return s};
const fresh=()=>migrate(JSON.parse(JSON.stringify(seed)));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=n=>Number(n||0).toLocaleString('pt-BR');
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d.split('-').reverse().join('/');
const dotYear=d=>{const m=/(\d{2})(\d{2})$/.exec((d||'').trim());return m?2000+ +m[2]:null};
const T=(id,brand,model,size,dot,tread,status,price,plate,pos,kmIn)=>({id,brand,model,size,dot,tread,status,price,plate:plate||null,pos:pos||null,kmIn:kmIn||null,kmRodado:0});
const seed={vehicles:[],tires:[],history:[],services:[],fuel:[],fuelPrices:{}};
const load=()=>{try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return fresh()};
const alertsOf=s=>{const a=[],yr=new Date().getFullYear();
 s.tires.forEach(t=>{
  if(t.status==='uso'&&t.tread!=null){
   if(t.tread<=1.6)a.push({t,lv:'bad',m:'Sulco de '+t.tread+' mm, abaixo do limite legal de 1,6 mm'});
   else if(t.tread<=3)a.push({t,lv:'warn',m:'Sulco de '+t.tread+' mm, troca próxima'});}
  if(t.status==='uso'&&t.kmVida>0){const u=kmTire(s,t);
   if(u>=t.kmVida)a.push({t,lv:'bad',m:'Passou da vida prevista: rodou '+N(u)+' de '+N(t.kmVida)+' km'});
   else if(u>=t.kmVida*0.9)a.push({t,lv:'warn',m:'Faltam '+N(t.kmVida-u)+' km para a vida prevista ('+N(u)+' de '+N(t.kmVida)+' km)'});}
  if(t.status==='uso'||t.status==='estoque'){const y=dotYear(t.dot);if(y&&yr-y>=5)a.push({t,lv:'warn',m:'DOT '+t.dot+': pneu com '+(yr-y)+' anos de fabricação'});}
 });
 return a.sort((x,y)=>(x.lv==='bad'?0:1)-(y.lv==='bad'?0:1))};
const IN='mt-1 w-full rounded-md border border-line bg-bg px-3 py-2 text-ink focus:outline-none focus:ring-2 focus:ring-accent';
const Fld=({l,children})=>html`<label class="block text-sm"><span class="text-mute">${l}</span>${children}</label>`;
const Sel=({v,on,opts,dis})=>html`<select class=${IN} value=${v} onChange=${on} disabled=${dis}>${opts.map(o=>html`<option key=${o[0]} value=${o[0]}>${o[1]}</option>`)}</select>`;
const UP=e=>{const el=e.target;if(el&&typeof el.value==='string'){const a=el.selectionStart,b=el.selectionEnd,u=el.value.toUpperCase();if(u!==el.value){el.value=u;try{el.setSelectionRange(a,b)}catch(x){}}}};
const Inp=({v,on,type,step,ph})=>{const tx=!type||type==='text';return html`<input class=${IN+(tx?' uppercase':'')} type=${type||'text'} step=${step} placeholder=${ph} value=${v} onChange=${e=>{if(tx)UP(e);on(e)}}/>`};
const Btn=({on,p,children,sm})=>html`<button onClick=${on} class=${(p?'bg-accent text-onaccent ':'border border-line text-ink ')+'rounded-md font-medium '+(sm?'px-3 py-1 text-sm':'px-4 py-2')}>${children}</button>`;
const Modal=({title,close,children,wide})=>html`<div class="fixed inset-0 z-20 flex items-end sm:items-center justify-center p-3" style=${{background:'rgba(0,0,0,.5)'}} onClick=${close}><div class=${'w-full max-h-full overflow-auto rounded-xl bg-panel border border-line p-5 '+(wide?'max-w-3xl':'max-w-lg')} onClick=${e=>e.stopPropagation()}><div class="flex items-center justify-between mb-4"><h3 class="font-head text-2xl font-semibold">${title}</h3><button class="text-mute px-2" onClick=${close} aria-label="Fechar">✕</button></div>${children}</div></div>`;
const Tread=({mm})=>{if(mm==null||mm==='')return html`<span class="text-sm text-mute">Sem medição</span>`;mm=Number(mm);const c=mm<=1.6?'var(--bad)':mm<=3?'var(--warn)':'var(--ok)';return html`<div class="flex items-center gap-2"><div class="h-2 w-20 rounded-sm bg-line overflow-hidden"><div style=${{width:Math.min(100,mm/12*100)+'%',background:c,height:'100%'}}></div></div><span class="tabular-nums text-sm">${mm.toFixed(1)} mm</span></div>`};
const Badge=({st})=>html`<span class=${'rounded px-2 py-0.5 text-xs font-medium '+STC[st]}>${ST[st]}</span>`;

const Foot=({err,close,ok,label})=>html`${err&&html`<p class="mt-3 text-sm text-bad" role="alert">${err}</p>`}<div class="mt-5 flex justify-end gap-2"><${Btn} on=${close}>Cancelar<//><${Btn} p=${1} on=${ok}>${label}<//></div>`;
const kmTire=(s,t)=>(t.kmRodado||0)+(t.status==='uso'?Math.max(0,vkm(s,t.plate)-(t.kmIn||0)):0);
const vkm=(s,p)=>(s.vehicles.find(v=>v.plate===p)||{km:0}).km;
const mt=(s,plate)=>{const v=s.vehicles.find(x=>x.plate===plate);return v&&v.kind==='equipamento'?{eq:1,u:'h',L:'Horímetro (h)',n:'Horímetro'}:{eq:0,u:'km',L:'Km',n:'Km'}};
const mv=(s,plate,x)=>N(x)+' '+mt(s,plate).u;
const tireOf=(n,id)=>n.tires.find(t=>t.id===id);
const byId=(a,b)=>String(a.id).localeCompare(String(b.id),'pt-BR',{numeric:true,sensitivity:'base'});

const log=(n,e)=>{const tt=n.tires.find(x=>x.id===e.tireId);n.history.unshift({id:Date.now()+Math.random(),unit:tt?tt.price:null,...e})};
const unitOf=(s,h)=>h.unit!=null?h.unit:((s.tires.find(x=>x.id===h.tireId)||{}).price??null);
const brlU=v=>v==null?'—':brl(v);
const bump=(n,plate,km)=>{const v=n.vehicles.find(v=>v.plate===plate);if(v&&km>v.km)v.km=km};
const doInstall=(n,t,plate,pos,km)=>{t.status='uso';t.plate=plate;t.pos=pos;t.kmIn=km;bump(n,plate,km)};
const doRemove=(n,t,km,dest)=>{t.kmRodado=(t.kmRodado||0)+Math.max(0,km-(t.kmIn||km));t.status=dest;t.plate=null;t.pos=null;t.kmIn=null;t.kmOut=km};
const inUse=s=>s.tires.filter(t=>t.status==='uso');
const tireOpts=(list,s)=>list.map(t=>[t.id,t.id+' · '+t.brand+' '+t.model+(t.cond?' ['+CONDL[t.cond]+']':'')+' · '+t.size+' · '+(t.tread==null?'sem sulco':Number(t.tread).toFixed(1)+' mm')+(t.plate?' ('+t.plate+', '+t.pos+')':'')]);

function TireForm({init,s,mut,close}){
 const edit=!!init;
 const [f,u]=useF(init?{...init,tread:init.tread==null?'':String(init.tread),price:String(init.price),kmVida:init.kmVida==null?'':String(init.kmVida),recaps:String(init.recaps||0)}:{id:'',brand:'',model:'',size:'',dot:'',tread:'',status:'estoque',cond:'novo',kmVida:'',price:'',recaps:'0'});
 const [err,setE]=useState('');
 const dup=f.id.trim()!==''&&s.tires.some(x=>x.id.toLowerCase()===f.id.trim().toLowerCase()&&(!edit||x.id!==init.id));
 const sub=()=>{
  if(!f.id.trim()||!f.brand.trim()||!f.model.trim()||!f.size.trim())return setE('Preencha número de fogo, marca, modelo e medida.');
  if(dup)return setE('Já existe um pneu com o número de fogo '+f.id.trim()+'. Use outro número.');
  if(!/^\d{4}$/.test(f.dot.trim()))return setE('O DOT precisa ter 4 dígitos (semana e ano, ex.: 1224).');
  if(f.kmVida!==''&&+f.kmVida<=0)return setE('A vida útil prevista em km precisa ser maior que zero (ou deixe em branco).');
  if(f.recaps===''||!(+f.recaps>=0)||!Number.isInteger(+f.recaps))return setE('Recapagens já feitas precisa ser um número inteiro (use 0 se nenhuma).');
  if((f.tread!==''&&+f.tread<0)||f.price===''||+f.price<0)return setE('Informe um sulco válido (ou deixe em branco) e o valor de compra.');
  mut(n=>{const bn=f.brand.trim().toUpperCase();
  const sk=x=>x.toLowerCase().replace(/\s+/g,'');const sn=sizesAll(s).find(z=>sk(z)===sk(f.size.trim()))||f.size.trim();
  const d={...f,brand:bn,size:sn,id:f.id.trim(),dot:f.dot.trim(),tread:f.tread===''?null:+f.tread,kmVida:f.kmVida===''?null:+f.kmVida,price:+f.price,recaps:+f.recaps};
   if(n.tires.some(x=>x.id.toLowerCase()===d.id.toLowerCase()&&(!edit||x.id!==init.id)))return;
   if(edit){const i=n.tires.findIndex(t=>t.id===init.id);if(init.id!==d.id)n.history.forEach(h=>{if(h.tireId===init.id)h.tireId=d.id;if(h.tireOut===init.id)h.tireOut=d.id});n.tires[i]={...n.tires[i],...d}}
   else n.tires.push({...d,plate:null,pos:null,kmIn:null,kmRodado:0});
   n.tires.sort(byId)});
  close()};
 return html`<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
  <${Fld} l="Número de fogo"><${Inp} v=${f.id} on=${u('id')} ph="F-0110"/>${dup&&html`<span class="mt-1 block text-xs text-bad" role="alert">Esse número já está cadastrado.</span>`}<//>
  <${Fld} l="Marca"><input class=${IN+' uppercase'} list="dl-brands" value=${f.brand} onChange=${e=>{UP(e);u('brand')(e)}} placeholder="Digite ou escolha" autoComplete="off"/><datalist id="dl-brands">${brandsAll(s).map(b=>html`<option key=${b} value=${b}/>`)}</datalist><//>
  <${Fld} l="Modelo"><${Inp} v=${f.model} on=${u('model')}/><//>
  <${Fld} l="Medida"><input class=${IN+' uppercase'} list="dl-sizes" value=${f.size} onChange=${e=>{UP(e);u('size')(e)}} placeholder="Digite ou escolha" autoComplete="off"/><datalist id="dl-sizes">${sizesAll(s).map(z=>html`<option key=${z} value=${z}/>`)}</datalist><//>
  <${Fld} l="DOT (semana + ano)"><${Inp} v=${f.dot} on=${u('dot')} ph="1224"/><//>
  <${Fld} l="Sulco atual (mm, opcional)"><${Inp} type="number" step="0.1" v=${f.tread} on=${u('tread')}/><//>
  <${Fld} l="Status"><${Sel} v=${f.status} on=${u('status')} dis=${f.status==='uso'} opts=${f.status==='uso'?[['uso','Em uso']]:[['estoque','Estoque'],['recapagem','Recapagem'],['sucata','Sucata']]}/><//>
  <${Fld} l="Tipo do pneu"><${Sel} v=${f.cond||'novo'} on=${u('cond')} opts=${Object.keys(CONDL).map(k=>[k,CONDL[k]])}/><//>
  <${Fld} l="Vida útil prevista (km, opcional)"><${Inp} type="number" step="1000" v=${f.kmVida} on=${u('kmVida')} ph="120000"/><//>
  <${Fld} l="Recapagens já feitas"><${Inp} type="number" step="1" v=${f.recaps} on=${u('recaps')} ph="0"/><//>
  <${Fld} l="Valor de compra (R$)"><${Inp} type="number" step="0.01" v=${f.price} on=${u('price')}/><//>
 </div>${f.status==='uso'&&html`<p class="mt-2 text-xs text-mute">Para mudar o status, retire o pneu do veículo na aba Frota.</p>`}

  const er=[];const r={...q,id:q.id.toUpperCase(),brand:q.brand.toUpperCase(),model:q.model.toUpperCase(),size:q.size.toUpperCase(),status:q.status.toLowerCase(),cond:q.cond.toLowerCase(),dot:/^\d{1,3}$/.test(q.dot)?q.dot.padStart(4,'0'):q.dot};

async function parseTiresXlsx(buf,s){

 const C={id:pick('fogo','numerodefogo','ndefogo','nfogo','id','numero'),brand:pick('marca'),model:pick('modelo'),size:pick('medida'),dot:pick('dot'),tread:pick('sulcomm','sulco'),status:pick('status'),cond:pick('tipo'),kmVida:pick('vidautilkm','vidautil','kmvida'),recaps:pick('recapagens','recapagensjafeitas'),price:pick('valordecomprar','valordecompra','valor','preco')};
 const miss=[['fogo',C.id,'Fogo'],['marca',C.brand,'Marca'],['modelo',C.model,'Modelo'],['medida',C.size,'Medida'],['dot',C.dot,'DOT'],['valor',C.price,'Valor de compra']].filter(x=>!x[1]).map(x=>x[2]);
 if(miss.length)return{fatal:'Não encontrei as colunas obrigatórias na primeira linha: '+miss.join(', ')+'. Use o modelo (.xlsx) ou o arquivo exportado desta aba.'};

 const recs=[];
 for(let r=2;r<=ws.rowCount;r++){const row=ws.getRow(r);
  const rec={id:g(row,C.id),brand:g(row,C.brand),model:g(row,C.model),size:g(row,C.size),dot:g(row,C.dot),tread:g(row,C.tread),status:g(row,C.status),cond:g(row,C.cond),kmVida:g(row,C.kmVida),recaps:g(row,C.recaps),price:g(row,C.price),row:r};

  recs.push(rec)}

function VehSvg({v,inst}){

 const H=18+body.length*RH+(spare.length?TH+10:0)+2;
 const tire=(x,y,key)=>{const t=inst[v.plate+'|'+key];
  const sc=t&&t.tread!=null?(t.tread<=1.6?'var(--bad)':t.tread<=3?'#C2410C':'#8A6A00'):'#8A6A00';
  return t?html`<rect key=${key} x=${x} y=${y} width=${TW} height=${TH} rx="3.5" fill="#F2B705" stroke=${sc} strokeWidth="1.8"/>`:html`<rect key=${key} x=${x} y=${y} width=${TW} height=${TH} rx="3.5" fill="none" stroke="var(--mute)" strokeWidth="1.2" strokeDasharray="2.5 2"/>`};
 const els=[];
 body.forEach((a,ai)=>{const ps=posOf({axles:[a]}),hh=Math.floor(ps.length/2),y=18+ai*RH,L=ps.slice(0,hh),R=ps.slice(hh);
  const lEnd=2+L.length*(TW+GP)-GP,rStart=CW-2-R.length*(TW+GP)+GP;
  els.push(html`<rect key=${'b'+a.id} x=${lEnd} y=${y+TH/2-2} width=${Math.max(0,rStart-lEnd)} height="4" rx="2" fill="var(--mute)"/>`);
  L.forEach((p,i)=>els.push(tire(2+i*(TW+GP),y,p.key)));

const fuelCheck=(recs,s)=>{
 const num=v=>{const t=String(v).trim();return +(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t)};
 const seen=new Set((s.fuel||[]).map(x=>[x.plate,x.date,x.km,Number(x.liters).toFixed(2)].join('|')));
 return recs.map((r,i)=>{
  const er=[];const plate=r.plate.toUpperCase();let dt=r.dt;
  const mm=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(dt);if(mm)dt=mm[3]+'-'+mm[2].padStart(2,'0')+'-'+mm[1].padStart(2,'0');
  const km=/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(r.km)?r.km.replace(/\./g,'').replace(',','.'):r.km;const lit=r.lit,val=r.val,fl=r.fl.toLowerCase(),note=r.note.toUpperCase();
  if(!plate)er.push('falta o veículo (placa)');else if(!s.vehicles.some(v=>v.plate.toUpperCase()===plate))er.push('veículo '+plate+' não está cadastrado na Frota');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(new Date(dt)))er.push('data inválida (use uma data do Excel ou DD/MM/AAAA)');
  if(km===''||!(num(km)>=0))er.push('km ausente ou inválido');
  if(lit===''||!(num(lit)>0))er.push('litros ausentes ou inválidos');
  if(val!==''&&!(num(val)>=0))er.push('valor inválido');
  const full=fl===''?true:/^(sim|s|true|1|yes)$/.test(fl)?true:/^(nao|não|n|false|0|no)$/.test(fl)?false:null;if(full===null)er.push('tanque cheio inválido (use Sim ou Não)');
  let d=null;
  if(!er.length){const real=s.vehicles.find(v=>v.plate.toUpperCase()===plate).plate;const key=[real,dt,num(km),num(lit).toFixed(2)].join('|');if(seen.has(key))er.push('abastecimento já cadastrado ou repetido (mesmo veículo, data, km e litros)');else{seen.add(key);d={plate:real,date:dt,km:num(km),liters:num(lit),value:val===''?0:num(val),full,note}}}

  <div class=${'w-24 shrink-0 truncate '+(sel===d.label?'font-semibold text-ink':'text-mute')}>${d.label}</div>
  <div class="flex flex-1 items-center gap-2"><div style=${{width:Math.max(d.value/max*100,d.value>0?1.5:0)+'%',height:'16px',background:'var(--s1)',borderRadius:'0 4px 4px 0',opacity:(h<0&&!sel)||h===i||sel===d.label?1:.5}}></div><span class="whitespace-nowrap">${fmt(d.value)}</span></div></div>`)}</div>`}
function StackCol({data,series,onPick,sel,label}){
 const [h,setH]=useState(-1);

 const max=niceMax(Math.max(...data.map(tot),0)),band=(W-pl-pr)/n,bw=Math.min(28,band*0.64),step=Math.ceil(n/10),yy=v=>y0-v/max*ph;
 return html`<div class="relative"><div class="mb-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-mute">${series.map(x=>html`<span key=${x.n} class="inline-flex items-center gap-1.5"><i class="inline-block h-2.5 w-2.5 rounded-sm" style=${{background:x.c}}></i>${x.n}</span>`)}</div>
 <svg viewBox=${'0 0 '+W+' '+H} class="w-full" role="img" aria-label=${label}>
  ${[0,.5,1].map(f=>html`<g key=${f}><line x1=${pl} x2=${W-pr} y1=${yy(max*f)} y2=${yy(max*f)} stroke=${f===0?'var(--axis)':'var(--line)'} strokeWidth="1"/><text x=${pl-6} y=${yy(max*f)+4} textAnchor="end" fontSize="11" fill="var(--mute)">${cmoney(max*f)}</text></g>`)}
  ${data.map((d,i)=>{let acc=0;const x=pl+band*i+(band-bw)/2;
   return html`<g key=${d.k} opacity=${(h<0&&!sel)||h===i||sel===d.k?1:.5}>
    ${d.v.map((v,j)=>{const y1=yy(acc+v),y2=yy(acc);acc+=v;const hh=y2-y1;return hh>0.5&&html`<rect key=${j} x=${x} y=${y1} width=${bw} height=${Math.max(hh-2,1)} rx="2" fill=${series[j].c}/>`})}
    ${sel===d.k&&html`<rect x=${x-3} y=${yy(tot(d))-3} width=${bw+6} height=${y0-yy(tot(d))+3} fill="none" stroke="var(--ink)" strokeWidth="1.5" rx="3"/>`}
    ${i%step===0&&html`<text x=${x+bw/2} y=${H-8} textAnchor="middle" fontSize="11" fill="var(--mute)">${d.label}</text>`}

function Usuarios({sb,me}){
 const [rows,setRows]=useState(null);const [err,setErr]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);const [cd,setCd]=useState('');
 const [f,setF]=useState({nome:'',email:'',perfil:'operador'});
 const load=async()=>{const r=await sb.from('usuarios_autorizados').select('email,nome,perfil,ativo').order('nome',{ascending:true});if(r.error)return setErr('Não foi possível carregar: '+r.error.message);setRows(r.data||[])};
 useEffect(()=>{load()},[]);
 const run=async(p,okMsg)=>{setBusy(true);setMsg('');let r;try{r=await p}catch(e){r={error:e}}setBusy(false);
  if(r.error){const m=r.error.message||'';setErr(/ao menos um administrador/i.test(m)?'Deve existir ao menos um administrador ativo.':/duplicate|unique/i.test(m)?'Esse e-mail já está cadastrado.':/row-level|permission/i.test(m)?'Você não tem permissão para isso.':'Não foi possível salvar: '+m);return false}
  setErr('');setMsg(okMsg);await load();return true};
 const add=async e=>{e.preventDefault();const em=f.email.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return setErr('Informe um e-mail válido.');if(!f.nome.trim())return setErr('Informe o nome.');
  if(await run(sb.from('usuarios_autorizados').insert({email:em,nome:f.nome.trim(),perfil:f.perfil}),'Usuário incluído. Peça para ele abrir o sistema e clicar em "Primeiro acesso? Criar conta", usando este e-mail.'))setF({nome:'',email:'',perfil:'operador'})};
 const upd=(email,patch)=>run(sb.from('usuarios_autorizados').update(patch).eq('email',email),'Alteração salva.');
 const del=async email=>{setCd('');await run(sb.from('usuarios_autorizados').delete().eq('email',email),'Usuário removido do sistema.')};
 const mine=(me||'').toLowerCase();
 return html`<div class="grid gap-5">
  <div class="grid gap-3 md:grid-cols-3">${Object.keys(PERF).map(k=>html`<div key=${k} class="rounded-md border border-line bg-panel p-4"><div class="font-head text-xl font-semibold">${PERF[k]}</div><p class="mt-1 text-sm text-mute">${PDESC[k]}</p></div>`)}</div>
  <form onSubmit=${add} class="rounded-lg border border-line bg-panel p-4"><div class="font-head text-xl font-semibold mb-3">Autorizar novo usuário</div>
   <div class="grid gap-3 md:grid-cols-4 items-end">
    <label class="text-sm font-medium">Nome<input class=${IN} value=${f.nome} onChange=${e=>setF({...f,nome:e.target.value})}/></label>
    <label class="text-sm font-medium">E-mail<input type="email" class=${IN} value=${f.email} onChange=${e=>setF({...f,email:e.target.value})}/></label>
    <label class="text-sm font-medium">Perfil<select class=${IN} value=${f.perfil} onChange=${e=>setF({...f,perfil:e.target.value})}>${Object.keys(PERF).map(k=>html`<option key=${k} value=${k}>${PERF[k]}</option>`)}</select></label>
    <button type="submit" disabled=${busy} class="rounded-md bg-brand px-4 py-2 font-medium text-onbrand disabled:opacity-60">Autorizar</button></div>
   ${err&&html`<p class="mt-3 text-sm text-bad" role="alert">${err}</p>`}${msg&&html`<p class="mt-3 text-sm" role="status">${msg}</p>`}</form>
  <div class="overflow-x-auto rounded-lg border border-line bg-panel"><table class="tbl w-full text-sm whitespace-nowrap"><thead><tr class="text-left text-mute">${['Nome','E-mail','Perfil','Ativo',''].map(c=>html`<th key=${c} class="font-medium px-3 py-2">${c}</th>`)}</tr></thead><tbody>
   ${(rows||[]).map(u=>{const eu=u.email===mine;return html`<tr key=${u.email} class="border-t border-line"><td class="px-3 py-2 font-semibold">${u.nome||'—'}${eu&&html` <span class="ml-1 rounded border border-line px-1.5 text-xs font-normal text-mute">você</span>`}</td><td class="px-3 py-2">${u.email}</td>
    <td class="px-3 py-2"><select aria-label=${'Perfil de '+u.email} disabled=${busy||eu} class=${IN+' !mt-0 !py-1'} value=${u.perfil} onChange=${e=>upd(u.email,{perfil:e.target.value})}>${Object.keys(PERF).map(k=>html`<option key=${k} value=${k}>${PERF[k]}</option>`)}</select></td>
    <td class="px-3 py-2"><input type="checkbox" aria-label=${'Ativo: '+u.email} disabled=${busy||eu} checked=${u.ativo} onChange=${e=>upd(u.email,{ativo:e.target.checked})}/></td>
    <td class="px-3 py-2 text-right">${eu?'':cd===u.email?html`Remover? <button class="underline text-bad" onClick=${()=>del(u.email)}>Sim</button> <button class="underline" onClick=${()=>setCd('')}>Não</button>`:html`<button class="underline" onClick=${()=>setCd(u.email)}>Remover</button>`}</td></tr>`})}
  </tbody></table>${rows&&!rows.length&&html`<p class="p-4 text-sm text-mute">Nenhum usuário cadastrado.</p>`}${!rows&&html`<p class="p-4 text-sm text-mute">Carregando…</p>`}</div>
  <p class="text-sm text-mute">Desativar bloqueia o acesso sem apagar o usuário. A senha de cada pessoa é criada por ela mesma no primeiro acesso; para redefinir uma senha, use Authentication → Users no painel do Supabase.</p></div>`}
function AcessosPainel({sync,go}){
 const adm=sync.role==='administrador';const [rows,setRows]=useState(null);const [err,setErr]=useState('');
 useEffect(()=>{let ok=true;(async()=>{try{const r=await sync.sb.from('usuarios_autorizados').select('email,nome,perfil,ativo').order('nome',{ascending:true});if(!ok)return;if(r.error)return setErr('Não foi possível carregar os usuários.');setRows(r.data||[])}catch(e){if(ok)setErr('Não foi possível carregar os usuários.')}})();return()=>{ok=false}},[]);
 const mine=(sync.email||'').toLowerCase();
 const list=(rows||[]).filter(u=>adm||u.email===mine);
 const BD={administrador:'border-brand text-brand',operador:'border-line text-ink',consulta:'border-line text-mute'};
 const n=k=>list.filter(u=>u.perfil===k&&u.ativo).length;
 return html`<div class="mt-8 border-t border-line pt-5"><div class="mb-3 flex flex-wrap items-end justify-between gap-2"><div><div class="font-head text-2xl font-semibold">Logins e usuários</div>
  <p class="text-sm text-mute">${adm?(rows?n('administrador')+' administrador(es), '+n('operador')+' operador(es) e '+n('consulta')+' de consulta ativos.':'Carregando…'):'Seu acesso a este sistema.'}</p></div>
  ${adm&&html`<${Btn} on=${()=>go('usr')}>Gerenciar usuários<//>`}</div>
  ${err?html`<p class="text-sm text-bad" role="alert">${err}</p>`:html`<div class="overflow-x-auto rounded-lg border border-line bg-panel"><table class="tbl w-full text-sm whitespace-nowrap"><thead><tr class="text-left text-mute">${['Nome','E-mail','Perfil','Situação','Permissões'].map(c=>html`<th key=${c} class="font-medium px-3 py-2">${c}</th>`)}</tr></thead><tbody>
   ${list.map(u=>html`<tr key=${u.email} class="border-t border-line"><td class="px-3 py-2 font-semibold">${u.nome||'—'}${u.email===mine&&html` <span class="ml-1 rounded border border-line px-1.5 text-xs font-normal text-mute">você</span>`}</td><td class="px-3 py-2">${u.email}</td>
    <td class="px-3 py-2"><span class=${'rounded border px-2 py-0.5 text-xs font-medium '+(BD[u.perfil]||'')}>${PERF[u.perfil]||u.perfil}</span></td>
    <td class="px-3 py-2"><span class="inline-flex items-center gap-2"><i class="inline-block h-2 w-2 rounded-full" style=${{background:u.ativo?'var(--ok)':'var(--bad)'}}></i>${u.ativo?'Ativo':'Desativado'}</span></td>
    <td class="px-3 py-2 text-mute">${PDESC[u.perfil]||''}</td></tr>`)}
  </tbody></table>${rows&&!list.length&&html`<p class="p-4 text-sm text-mute">Nenhum usuário encontrado.</p>`}${!rows&&html`<p class="p-4 text-sm text-mute">Carregando…</p>`}</div>`}</div>`}
function Root(){
 const [sess,setSess]=useState(undefined);const [rec,setRec]=useState(null);const [me,setMe]=useState(null);const [err,setErr]=useState('');const [st,setSt]=useState('');const [remote,setRemote]=useState(null);const [recov,setRecov]=useState(RECOV);
 const ver=React.useRef(0),timer=React.useRef(null),pend=React.useRef(null),busy=React.useRef(false),conf=React.useRef(false),fl=React.useRef(null),mail=React.useRef(''),role=React.useRef('');
 useEffect(()=>{if(!sb)return;let ok=true;sb.auth.getSession().then(({data})=>{if(ok)setSess(data.session||null)},()=>{if(ok)setSess(null)});
  const r=sb.auth.onAuthStateChange((ev,x)=>{if(!ok)return;if(ev==='PASSWORD_RECOVERY')setRecov(true);setSess(x||null)});return()=>{ok=false;try{r.data.subscription.unsubscribe()}catch(e){}}},[]);
 const uid=sess&&sess.user?sess.user.id:null;mail.current=sess&&sess.user?(sess.user.email||''):'';
 useEffect(()=>{setRec(null);setMe(null);setErr('');pend.current=null;conf.current=false;role.current='';if(!sb||!uid)return;let ok=true;
  (async()=>{
   const m=await sb.from('usuarios_autorizados').select('nome,perfil,ativo').eq('email',mail.current.toLowerCase()).maybeSingle();if(!ok)return;
   if(m.error)return setErr('Não foi possível verificar o seu acesso: '+m.error.message);
   if(!m.data)return setErr('O e-mail '+mail.current+' não está autorizado. Peça a um administrador para incluí-lo na aba Usuários.');
   if(!m.data.ativo)return setErr('O seu acesso está desativado. Fale com um administrador.');
   const r=await sb.from('estado_frota').select('dados,versao').eq('id',1).maybeSingle();if(!ok)return;
   if(r.error)return setErr('Não foi possível carregar os dados: '+r.error.message);
   if(!r.data)return setErr('Sem acesso aos dados. Confirme que o script SQL foi executado.');
   role.current=m.data.perfil;ver.current=r.data.versao;setMe(m.data);setRec(r.data);setSt('salvo')})().catch(()=>{if(ok)setErr('Sem conexão com o Supabase.')});
  return()=>{ok=false}},[uid]);
 const flush=async()=>{if(busy.current||!pend.current||conf.current||role.current==='consulta')return;busy.current=true;const d=pend.current;pend.current=null;setSt('salvando');let r;
  try{r=await sb.from('estado_frota').update({dados:d,versao:ver.current+1,atualizado_por:mail.current,atualizado_em:new Date().toISOString()}).eq('id',1).eq('versao',ver.current).select('versao')}catch(e){r={error:e}}
  busy.current=false;
  if(r.error){pend.current=pend.current||d;setSt('erro');clearTimeout(timer.current);timer.current=setTimeout(()=>fl.current(),5000);return}
  if(!r.data||!r.data.length){
   let e2;try{e2=await sb.from('usuarios_autorizados').select('perfil,ativo').eq('email',mail.current.toLowerCase()).maybeSingle()}catch(e){e2={}}
   if(e2.data&&(!e2.data.ativo||e2.data.perfil==='consulta')){role.current='consulta';pend.current=null;await pull(false);setSt('semperm');return}
   pend.current=pend.current||d;conf.current=true;setSt('conflito');return}
  ver.current=r.data[0].versao;if(pend.current){setSt('pendente');timer.current=setTimeout(()=>fl.current(),300)}else setSt('salvo')};
 fl.current=flush;
 const sync={role:me?me.perfil:'consulta',sb,email:mail.current,nome:me?me.nome:'',save:d=>{if(role.current==='consulta')return;pend.current=d;if(conf.current)return;setSt('pendente');clearTimeout(timer.current);timer.current=setTimeout(()=>fl.current(),800)}};
 const pull=async keep=>{const {data,error}=await sb.from('estado_frota').select('dados,versao').eq('id',1).maybeSingle();if(error||!data)return setSt('erro');
  ver.current=data.versao;conf.current=false;
  if(keep){setSt('pendente');fl.current()}else{pend.current=null;setRemote({dados:data.dados,tick:Date.now()});setSt('salvo')}};
 useEffect(()=>{if(!sb||!uid||!rec)return;const t=setInterval(async()=>{if(pend.current||busy.current||conf.current)return;
   try{const {data}=await sb.from('estado_frota').select('versao').eq('id',1).maybeSingle();if(data&&data.versao>ver.current){const r=await sb.from('estado_frota').select('dados,versao').eq('id',1).maybeSingle();
    if(r.data&&!pend.current&&!busy.current&&!conf.current&&r.data.versao>ver.current){ver.current=r.data.versao;setRemote({dados:r.data.dados,tick:Date.now()});setSt('salvo')}}}catch(e){}},15000);return()=>clearInterval(t)},[uid,!!rec]);
 useEffect(()=>{const f=e=>{if(pend.current||busy.current){e.preventDefault();e.returnValue=''}};window.addEventListener('beforeunload',f);return()=>window.removeEventListener('beforeunload',f)},[]);
 const sair=()=>{try{sb.auth.signOut()}catch(e){}};
 if(!sb)return html`<${Msg} t="Falta configurar o Supabase"><p class="text-sm">Abra este arquivo em um editor de texto e troque <b>COLE_AQUI_A_PROJECT_URL</b> e <b>COLE_AQUI_A_CHAVE_PUBLICA</b> no início do arquivo (bloco FROTA_CONFIG). Se já trocou, verifique a conexão com a internet.</p><//>`;
 if(sess===undefined)return html`<${Msg} t="Carregando…"><//>`;
 if(!sess)return html`<${Login}/>`;
 if(recov)return html`<${NovaSenha} done=${()=>{setRecov(false);try{history.replaceState(null,'',HERE)}catch(e){}}} sair=${()=>{setRecov(false);sair()}}/>`;
 if(err)return html`<${Msg} t="Não foi possível abrir"><p class="text-sm">${err}</p><button class="mt-4 underline text-sm" onClick=${sair}>Sair</button><//>`;
 if(!rec||!me)return html`<${Msg} t="Carregando dados…"><//>`;
 const LBL={salvo:'Salvo no Supabase',pendente:'Alterações pendentes…',salvando:'Salvando…',erro:'Erro ao salvar. Tentando de novo…',conflito:'Conflito: outra pessoa salvou antes',semperm:'Sem permissão para salvar: dados recarregados'};
 const d=rec.dados&&Array.isArray(rec.dados.vehicles)&&Array.isArray(rec.dados.tires)?rec.dados:null;
 return html`${st==='conflito'&&html`<div class="fixed inset-x-0 top-0 z-50 border-b border-warn bg-panel p-3 text-sm text-center" role="alert">Outra pessoa salvou alterações antes de você. <button class="underline font-medium mx-2" onClick=${()=>pull(false)}>Carregar os dados do servidor (descarta as suas alterações não salvas)</button> <button class="underline font-medium" onClick=${()=>pull(true)}>Manter as minhas alterações</button></div>`}
  <${App} init=${d||fresh()} remote=${remote} sync=${sync}/>
  <div class="fixed bottom-2 right-2 z-40 flex items-center gap-3 rounded-md border border-line bg-panel px-3 py-1.5 text-xs shadow" role="status"><span class=${st==='erro'||st==='conflito'||st==='semperm'?'text-bad':'text-mute'}>${LBL[st]||''}</span><span class="text-mute">${me.nome||sess.user.email} · ${PERF[me.perfil]}</span><button class="underline" onClick=${sair}>Sair</button></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
</script>
</body>
</html>
